name: Deploy site to GitHub Pages

# Publishes the static site/ folder to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the deploy guard (emergencies only)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Deploy guard: a build with Site Health errors, broken JSON or a JavaScript syntax error is never
      # published; the live site stays on the last good version. (Warnings never block.)
      - name: Deploy guard
        if: ${{ !inputs.force }}
        run: |
          python3 build/deploy_check.py
          for f in site/js/*.js; do node --check "$f" || { echo "::error::JavaScript syntax error in $f"; exit 1; }; done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
